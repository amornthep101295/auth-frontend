<div class="center-container">
  <mat-card class="auth-card">
    <mat-card-header style="justify-content: center; margin-bottom: 20px;">      
      <mat-card-title style="color: #005A36; font-size: 24px;">เข้าสู่ระบบ</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>User</mat-label>
          <input matInput formControlName="username" placeholder="กรอกชื่อผู้ใช้งาน">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="กรอกรหัสผ่าน">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" style="color: #005A36;">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div style="margin-top: 20px;">
          <button mat-flat-button type="submit" class="full-width" style="background-color: #A47B46; color: white; height: 48px; font-size: 16px;">
            ลงชื่อเข้าใช้งาน
          </button>
        </div>

        <div style="text-align: center; margin-top: 15px;">
          <a routerLink="/register" style="color: #005A36; text-decoration: none; font-weight: 500;">สมัครสมาชิกใหม่</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

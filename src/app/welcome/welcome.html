<div class="center-container">
  <mat-card class="auth-card" style="text-align: center; padding: 40px 20px;">
    <mat-card-content>      
      <h2 style="color: #005A36; font-size: 28px; margin: 0;">Welcome</h2>
      
      <p style="color: #A47B46; font-size: 20px; font-weight: 500; margin-top: 10px;">
        User : {{ username }}
      </p>

      <div style="margin-top: 30px;">
        <button mat-stroked-button color="warn" (click)="logout()">ออกจากระบบ</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
